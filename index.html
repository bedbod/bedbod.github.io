<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bennet de Boer Design</title>
  <link rel="icon" type="image/png" href="assets/img/yellow.png">
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">

  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/screen.css">

  <script src="assets/js/main.js"></script>

</head>

<body>

    <div class="header">
        <div class="title">
            <p>BEnnet</p>
            <p>De BOer</p>
            <p>Design</p>
        </div>

        <div id="filter">
            <button class="btn all active" onclick="filterSelection('all')">Show all</button>
            <button class="btn editorial" onclick="filterSelection('editorial')">Editorial Projects</button>
            <button class="btn photography" onclick="filterSelection('photography')">Photography</button>
            <button class="btn video" onclick="filterSelection('video')">Video</button>
            <button class="btn paintings" onclick="filterSelection('paintings')">Paintings & Drawings</button>
            <button class="btn miscellaneous" onclick="filterSelection('miscellaneous')">Miscellaneous</button>
        </div>
    </div>


    <div class="gallery">
        <div class="box editorial">
            <img src="assets/img/gallery/piss-catalogue-thumbnail.jpg" alt="Piss Catalogue">
            <div class="overlay"></div>
                <div class="overlaytext">Piss Catalogue</div>
        </div>

        <div class="box miscellaneous">
            <img src="assets/img/gallery/the-call_thumbnail.jpg" alt="the call of your nature and the voice of god">
            <div class="overlay"></div>
                <div class="overlaytext">the call of your nature and the voice of god</div>
        </div>

        <div class="box video">
            <img src="assets/img/gallery/voyeur_thumbnail.jpg" alt="VOYEUR">
            <div class="overlay"></div>
                <div class="overlaytext">VOYEUR</div>
        </div>

        <div class="box video">
            <img src="assets/img/gallery/cinematique_thumbnail.jpg" alt="Cinématique des Nikolai Rollgier">
            <div class="overlay"></div>
                <div class="overlaytext">Cinématique des Nikolai Rollgier</div>
        </div>

        <div class="box editorial">
            <img src="assets/img/gallery/101_thumbnail.jpg" alt="#101 – M/M:M+M">
            <div class="overlay"></div>
                <div class="overlaytext">#101 – M/M:M+M</div>
        </div>
    </div>


</body>
