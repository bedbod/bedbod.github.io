<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bennet de Boer Design</title>
  <link rel="icon" type="image/png" href="assets/img/yellow.png">
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">

  <link rel="stylesheet" href="assets/css/font.css">
  <link rel="stylesheet" href="assets/css/screen.css">

  <script src="assets/js/main.js"></script>

</head>

<body>

    <div class="header">
        <div class="title">
            <p style="font-weight: bold; margin-bottom: -15px;">BEDBOD</p>
            <p>bennet de boer design</p>
        </div>

        <div id="filter">
            <button class="btn all active" onclick="filterSelection('all')">Show all</button>
            <button class="btn editorial" onclick="filterSelection('editorial')">Editorial Projects</button>
            <button class="btn photography" onclick="filterSelection('photography')">Photography</button>
            <button class="btn video" onclick="filterSelection('video')">Video</button>
            <button class="btn paintings" onclick="filterSelection('paintings')">Paintings & Drawings</button>
            <button class="btn miscellaneous" onclick="filterSelection('miscellaneous')">Miscellaneous</button>
        </div>
    </div>


    <div class="gallery">
        <button popovertarget="pisscatalogue" class="box editorial">
            <img src="assets/img/gallery/piss-catalogue-thumbnail.jpg" alt="Piss Catalogue">
            <div class="overlay"></div>
                <div class="overlaytext">Piss Catalogue</div>
        </button>
            <div popover id="pisscatalogue" popovertargetaction="show" class="popup">
                <div class="popover-content">
                    <button popovertarget="pisscatalogue" popovertargetaction="hide" class="close">&times;</button>

                    <div class="images">
                        <img src="assets/img/piss-catalogue/piss-catalogue_1.jpg" alt="Piss Catalogue 1">
                        <img src="assets/img/piss-catalogue/piss-catalogue_2.jpg" alt="Piss Catalogue 2">
                        <img src="assets/img/piss-catalogue/piss-catalogue_3.jpg" alt="Piss Catalogue 3">
                        <img src="assets/img/piss-catalogue/piss-catalogue_4.jpg" alt="Piss Catalogue 4">
                        <img src="assets/img/piss-catalogue/piss-catalogue_5.jpg" alt="Piss Catalogue 5">
                        <img src="assets/img/piss-catalogue/piss-catalogue_6.jpg" alt="Piss Catalogue 6">
                        <img src="assets/img/piss-catalogue/piss-catalogue_7.jpg" alt="Piss Catalogue 7">
                        <img src="assets/img/piss-catalogue/piss-catalogue_8.jpg" alt="Piss Catalogue 8">
                        <img src="assets/img/piss-catalogue/piss-catalogue_9.jpg" alt="Piss Catalogue 9">
                        <img src="assets/img/piss-catalogue/piss-catalogue_10.jpg" alt="Piss Catalogue 10">
                        <img src="assets/img/piss-catalogue/piss-catalogue_11.jpg" alt="Piss Catalogue 11">
                        <img src="assets/img/piss-catalogue/piss-catalogue_12.jpg" alt="Piss Catalogue 12">
                        <img src="assets/img/piss-catalogue/piss-catalogue_13.jpg" alt="Piss Catalogue 13">
                        <img src="assets/img/piss-catalogue/piss-catalogue_14.jpg" alt="Piss Catalogue 14">
                        <img src="assets/img/piss-catalogue/piss-catalogue_15.jpg" alt="Piss Catalogue 15">
                    </div>

                    <div class="info">
                        <h1>PISS CATALOGUE</h1>
                        <p>catalogue of 102 works depicting or using urine throughout art history </p>
                        <p>website:<br>
                        <a href="https://piss-catalogue.github.io">https://piss-catalogue.github.io</a></p>
                    </div>

                    <div class="media">
                        <iframe src="assets/img/piss-catalogue/piss_ansicht.pdf" title="Piss Catalogue File" width="auto"></iframe>
                    </div>

                </div>
            </div>

        <button popovertarget="cinematique" class="box video">
            <img src="assets/img/gallery/cinematique_thumbnail.jpg" alt="Cinématique des Nikolai Rollgier">
            <div class="overlay"></div>
                <div class="overlaytext">Cinématique des Nikolai Rollgier</div>
        </button>
            <div popover id="cinematique" popovertargetaction="show" class="popup">
                <div class="popover-content">
                    <button popovertarget="cinematique" popovertargetaction="hide" class="close">&times;</button>

                    <div class="media">
                        <video controls autoplay><source src="assets/img/cinematique/cinematique_video.mp4" type="video/mp4" title="Cinématique des Nikolai Rollgier"></source></video>
                    </div>
                </div>
            </div>

        <button class="box miscellaneous">
            <img src="assets/img/gallery/the-call_thumbnail.jpg" alt="the call of your nature and the voice of god">
            <div class="overlay"></div>
                <div class="overlaytext">the call of your nature and the voice of god</div>
        </button>

        <button class="box editorial">
            <img src="assets/img/gallery/101_thumbnail.jpg" alt="#101 – M/M:M+M">
            <div class="overlay"></div>
                <div class="overlaytext">#101 – M/M:M+M</div>
        </button>

        <button class="box video">
            <img src="assets/img/gallery/voyeur_thumbnail.jpg" alt="VOYEUR">
            <div class="overlay"></div>
        <div class="overlaytext">VOYEUR</div>
        </button>
    </div>

    

</body>
